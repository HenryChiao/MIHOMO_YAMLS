# ==================== 分流规则 ====================
rules:

  # ---------- 拦截 ----------
  # 禁止非 mihomo 进程访问 DoT(853), 防止应用自带 DNS 绕过分流
  - AND,((NOT,((OR,((PROCESS-NAME,mihomo),(PROCESS-NAME,ClashMeta))))),(DST-PORT,853)),广告拦截
  - GEOSITE,category-httpdns-cn,广告拦截            # 屏蔽 HTTPDNS, 否则去广告会失效
  - IP-CIDR,203.107.1.0/24,广告拦截,no-resolve      # 阿里云 HTTPDNS
  - RULE-SET,AWAvenue,广告拦截                      # 秋风广告规则

  # ---------- 本机与直连 ----------
  - GEOSITE,private,国内直连
  - GEOIP,private,国内直连,no-resolve
  - GEOSITE,connectivity-check,国内直连             # 网络连通性检测必须直连
  - DOMAIN-SUFFIX,pub.3gppnetwork.org,国内直连      # 运营商 IMS (VoLTE/VoWiFi) 必须直连, 别被代理
  - GEOSITE,googlefcm,国内直连                      # FCM 推送直连更省电也更稳
  - GEOSITE,category-games@cn,国内直连              # 国服游戏
  - RULE-SET,GameDownload,国内直连                  # 游戏平台下载 CDN, 直连跑满带宽
  - DOMAIN-SUFFIX,steamserver.net,国内直连          # Steam 游戏服务器

  # ---------- 人工智能 ----------
  - RULE-SET,OpenAI,人工智能                        # ChatGPT / Sora
  - RULE-SET,Anthropic,人工智能                     # Claude
  - RULE-SET,Gemini,人工智能
  - RULE-SET,xAI,人工智能                           # Grok
  - RULE-SET,Copilot,人工智能
  - RULE-SET,Perplexity,人工智能
  - RULE-SET,AI,人工智能                            # 其余国外 AI 服务

  # ---------- 社交 ----------
  # 国内社交 App 用 PROCESS-NAME 按包名整体归类, 能连带三方 CDN/统计一起兜住,
  # 比只靠域名规则更彻底 (依赖上面的 find-process-mode: strict; 内核上报的就是 Android 包名)。
  # 广告拦截在本节之前, 所以 App 内的广告域名仍然会被秋风规则拦掉。
  # 想加自己的 App: adb shell pm list packages -3 查包名, 照下面的格式加一行即可。
  - PROCESS-NAME,com.xingin.xhs,国内社交               # 小红书
  - PROCESS-NAME,com.max.xiaoheihe,国内社交            # 小黑盒
  - PROCESS-NAME,com.ss.android.ugc.aweme,国内社交     # 抖音
  - PROCESS-NAME,com.ss.android.ugc.livelite,国内社交  # 抖音极速版
  - RULE-SET,Xiaohongshu,国内社交
  - RULE-SET,Xiaoheihe,国内社交
  - RULE-SET,Douyin,国内社交
  - RULE-SET,SocialCN,国内社交                      # 微博/知乎/B站 等其余国内社交
  - RULE-SET,Telegram,海外社交
  - RULE-SET,Twitter,海外社交                       # X
  - RULE-SET,SocialOversea,海外社交                 # Facebook/Instagram/Discord/Reddit/WhatsApp 等

  # ---------- 媒体 ----------
  - RULE-SET,YouTube,国际媒体
  - RULE-SET,Netflix,国际媒体
  - RULE-SET,Disney,国际媒体
  - RULE-SET,Spotify,国际媒体
  - RULE-SET,TikTok,国际媒体
  - RULE-SET,Entertainment,国际媒体

  # ---------- 谷歌 / 微软 ----------
  - RULE-SET,Google,谷歌服务
  - RULE-SET,Microsoft,微软服务

  # ---------- 金融平台 ----------
  - RULE-SET,Crypto,金融平台                        # Binance/OKX/Trust Wallet/Coinbase 等
  - RULE-SET,Finance,金融平台                       # Wise/Stripe/IBKR/富途/老虎 等
  - RULE-SET,PayPal,金融平台
  - RULE-SET,Visa,金融平台
  - RULE-SET,Mastercard,金融平台
  - DOMAIN-SUFFIX,neverless.com,金融平台
  - DOMAIN-SUFFIX,revolut.com,金融平台

  # ---------- 游戏平台 ----------
  - RULE-SET,Steam,游戏平台
  - RULE-SET,Epic,游戏平台
  - RULE-SET,Xbox,游戏平台
  - RULE-SET,PlayStation,游戏平台
  - RULE-SET,Nintendo,游戏平台
  - RULE-SET,Games,游戏平台                          # 其余国外游戏平台

  # ---------- IP 规则 (放在域名规则之后) ----------
  - RULE-SET,TelegramIP,海外社交,no-resolve
  - RULE-SET,TwitterIP,海外社交,no-resolve
  - RULE-SET,FacebookIP,海外社交,no-resolve
  - RULE-SET,NetflixIP,国际媒体,no-resolve
  - RULE-SET,GoogleIP,谷歌服务,no-resolve

  # ---------- 国内 / 兜底 ----------
  - GEOSITE,cn,国内直连
  - GEOIP,cn,国内直连,no-resolve
  - GEOSITE,geolocation-!cn,全局代理
  - MATCH,兜底流量


