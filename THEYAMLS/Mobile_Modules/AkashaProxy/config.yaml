# ============================================================================
#  akashaProxy 默认配置模板 (mihomo 原生内核)
# ----------------------------------------------------------------------------
#  使用方法: 重命名为 config.yaml, 并在下方 proxy-providers 填入你的机场订阅
#  mihomo 文档: https://wiki.metacubex.one
#
#  【模块相关 请勿随意改名/删除的字段】
#    redir-port / tproxy-port / mixed-port  透明代理端口, 模块脚本会读取
#    dns.listen                             必须保持 ip:port 格式
#    external-controller                    必须保持 ip:port 格式
#    tun.enable / tun.auto-route / tun.device
#    ipv6 / geodata-mode / geo-auto-update / geox-url
#    dns.enhanced-mode
#  以上字段由 /data/adb/akashaProxy/clash.env 通过 yamlcli 解析, 改错会导致启动失败
#
#  【分流数据来源】
#    GEOSITE/GEOIP  -> 模块内置的 GeoSite.dat / GeoIP.dat (离线可用, 负责 cn 大类)
#    RULE-SET       -> MetaCubeX/meta-rules-dat 的 .mrs (细分类, 首次启动需联网)
#    广告拦截        -> 秋风广告规则 AWAvenue Ads Rule
# ============================================================================


# ==================== 锚点 (模板复用, 非 mihomo 配置项) ====================

# 订阅基础配置: 过滤掉机场的流量/到期/官网等信息节点
BaseProvider: &BaseProvider
  type: http
  interval: 86400
  proxy: DIRECT
  health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300, timeout: 3000, lazy: true}
  exclude-filter: '(?i)(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|重置|剩余|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author)'

# 策略组类型模板
BaseAuto:  &BaseAuto  {type: url-test,     interval: 300, tolerance: 50, lazy: true, url: 'https://www.gstatic.com/generate_204', hidden: true}
BaseFB:    &BaseFB    {type: fallback,     interval: 300, lazy: true, url: 'https://www.gstatic.com/generate_204'}
# 负载均衡: 散列(同一目标固定走同一节点, 兼容性好) / 轮询(逐连接轮换, 更容易叠加带宽)
BaseHash:  &BaseHash  {type: load-balance, interval: 300, lazy: true, url: 'https://www.gstatic.com/generate_204', strategy: consistent-hashing, hidden: true}
BaseRobin: &BaseRobin {type: load-balance, interval: 300, lazy: true, url: 'https://www.gstatic.com/generate_204', strategy: round-robin, hidden: true}

# 节点地区筛选正则
# 两条铁律, 改之前务必先看:
#  1) 绝不使用裸的单字中文 (日/美/英/港/台/韩/德/法...)。机场前缀会被误命中 ——
#     例如 additional-prefix 设成 '[日用] ' 时, 裸的 "日" 会让该机场的每个节点
#     都被判成日本节点。一律用双字国名/城市名。
#  2) 拉丁字母国家代码一律用 (?<![a-z])xx(?![a-z]) 包边界, 否则 Russia 会被判成
#     us, Ukraine 判成 uk, No.1 判成挪威, 10Gb 判成英国, example 判成波兰。
# 如果你的机场节点名既没有 flag emoji 也没有国家代码 (例如只写 "日 01"),
# 请自行往对应 Filter 里补上你机场用的写法。
FilterHK: &FilterHK '^(?=.*(?i)(香港|沪港|滬港|广港|廣港|深港|京港|🇭🇰|(?<![a-z])(?:hk|hkg|hongkong|hong\s?kong)(?![a-z])))(?!.*(?i)(台湾|臺灣|🇹🇼)).*$'
FilterTW: &FilterTW '^(?=.*(?i)(台湾|臺灣|台北|臺北|台中|臺中|台南|臺南|沪台|滬台|广台|廣台|深台|🇹🇼|(?<![a-z])(?:tw|twn|taiwan|tpe|khh)(?![a-z]))).*$'
FilterJP: &FilterJP '^(?=.*(?i)(日本|東京|东京|大阪|埼玉|名古屋|福冈|福岡|沪日|滬日|广日|廣日|深日|川日|泉日|🇯🇵|(?<![a-z])(?:jp|jpn|japan|nrt|hnd|kix|itm|tyo)(?![a-z]))).*$'
FilterKR: &FilterKR '^(?=.*(?i)(韩国|韓國|首尔|首爾|沪韩|滬韩|广韩|廣韓|深韩|🇰🇷|(?<![a-z])(?:kr|kor|korea|icn|gmp)(?![a-z]))).*$'
FilterSG: &FilterSG '^(?=.*(?i)(新加坡|狮城|獅城|沪新|滬新|广新|廣新|深新|🇸🇬|(?<![a-z])(?:sg|sgp|singapore|sin)(?![a-z]))).*$'
FilterUS: &FilterUS '^(?=.*(?i)(美国|美國|美西|美东|美東|洛杉矶|洛杉磯|圣何塞|聖何塞|硅谷|凤凰城|鳳凰城|达拉斯|達拉斯|西雅图|西雅圖|纽约|紐約|沪美|滬美|广美|廣美|深美|🇺🇸|(?<![a-z])(?:us|usa|united\s?states|lax|sjc|jfk|ord|sea|iad|dfw|mia)(?![a-z])))(?!.*(?i)(🇦🇺|澳大利亚|澳洲|(?<![a-z])(?:au|aus|australia)(?![a-z]))).*$'
FilterUK: &FilterUK '^(?=.*(?i)(英国|英國|伦敦|倫敦|🇬🇧|(?<![a-z])(?:uk|gbr|london|kingdom|lhr|lgw)(?![a-z]))).*$'
FilterEU: &FilterEU '^(?=.*(?i)(德国|德國|法国|法國|荷兰|荷蘭|瑞典|瑞士|意大利|義大利|西班牙|葡萄牙|波兰|波蘭|奥地利|奧地利|比利时|比利時|捷克|丹麦|丹麥|芬兰|芬蘭|爱尔兰|愛爾蘭|挪威|匈牙利|罗马尼亚|羅馬尼亞|希腊|希臘|土耳其|俄罗斯|俄羅斯|莫斯科|法兰克福|法蘭克福|阿姆斯特丹|苏黎世|蘇黎世|🇩🇪|🇫🇷|🇳🇱|🇸🇪|🇨🇭|🇮🇹|🇪🇸|🇵🇹|🇵🇱|🇦🇹|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇮🇪|🇳🇴|🇭🇺|🇷🇴|🇬🇷|🇹🇷|🇷🇺|(?<![a-z])(?:de|deu|fr|fra|nl|nld|se|swe|ch|che|it|ita|es|esp|pt|prt|pl|pol|aut|austria|bel|belgium|cz|cze|dk|dnk|fi|fin|ie|irl|nor|norway|hu|hun|ro|rou|gr|grc|ru|rus|tr|tur|cdg|ams|arn|mad|lis|vie|waw|zrh|bru)(?![a-z])))(?!.*(?i)(英国|英國|伦敦|倫敦|🇬🇧|(?<![a-z])(?:uk|london)(?![a-z]))).*$'
# 其他地区: 排除上面所有已划分地区, 同时排除机场的信息节点
FilterOT: &FilterOT '^(?!.*(?i)(香港|沪港|滬港|广港|廣港|深港|京港|台湾|臺灣|台北|臺北|台中|臺中|台南|臺南|沪台|滬台|广台|廣台|深台|日本|東京|东京|大阪|埼玉|名古屋|福冈|福岡|沪日|滬日|广日|廣日|深日|川日|泉日|韩国|韓國|首尔|首爾|沪韩|滬韩|广韩|廣韓|深韩|新加坡|狮城|獅城|沪新|滬新|广新|廣新|深新|美国|美國|美西|美东|美東|洛杉矶|洛杉磯|圣何塞|聖何塞|硅谷|凤凰城|鳳凰城|达拉斯|達拉斯|西雅图|西雅圖|纽约|紐約|沪美|滬美|广美|廣美|深美|英国|英國|伦敦|倫敦|德国|德國|法国|法國|荷兰|荷蘭|瑞典|瑞士|意大利|義大利|西班牙|葡萄牙|波兰|波蘭|奥地利|奧地利|比利时|比利時|捷克|丹麦|丹麥|芬兰|芬蘭|爱尔兰|愛爾蘭|挪威|匈牙利|罗马尼亚|羅馬尼亞|希腊|希臘|土耳其|俄罗斯|俄羅斯|莫斯科|法兰克福|法蘭克福|阿姆斯特丹|苏黎世|蘇黎世|🇭🇰|🇹🇼|🇯🇵|🇰🇷|🇸🇬|🇺🇸|🇬🇧|🇩🇪|🇫🇷|🇳🇱|🇸🇪|🇨🇭|🇮🇹|🇪🇸|🇵🇹|🇵🇱|🇦🇹|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇮🇪|🇳🇴|🇭🇺|🇷🇴|🇬🇷|🇹🇷|🇷🇺|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|重置|剩余|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(?<![a-z])(?:direct|reject|hk|hkg|hongkong|tw|twn|taiwan|tpe|khh|jp|jpn|japan|nrt|hnd|kix|itm|tyo|kr|kor|korea|icn|gmp|sg|sgp|singapore|sin|us|usa|lax|sjc|jfk|ord|sea|iad|dfw|mia|uk|gbr|london|kingdom|lhr|lgw|de|deu|fr|fra|nl|nld|se|swe|ch|che|it|ita|es|esp|pt|prt|pl|pol|aut|bel|cz|cze|dk|dnk|fi|fin|ie|irl|nor|hu|hun|ro|rou|gr|grc|ru|rus|tr|tur|cdg|ams|arn|mad|lis|vie|waw|zrh|bru|used|total|expire|email|panel|channel|author)(?![a-z]))).*$'
# 全部节点: 排除内置策略和机场的信息节点
FilterALL: &FilterALL '^(?!.*(?i)(直连|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|重置|剩余|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(?<![a-z])(?:direct|reject|used|total|expire|email|panel|channel|author)(?![a-z]))).*$'

# 策略组候选列表模板
SelectProxy:  &SelectProxy  {type: select, proxies: [全局代理, 故障转移, 香港, 台湾, 日本, 韩国, 新加坡, 美国, 英国, 欧洲, 其他地区, 手动选择, 直接连接]}
SelectDirect: &SelectDirect {type: select, proxies: [直接连接, 全局代理, 故障转移, 香港, 台湾, 日本, 韩国, 新加坡, 美国, 英国, 欧洲, 其他地区, 手动选择]}
SelectHK:     &SelectHK     {type: select, proxies: [香港, 全局代理, 故障转移, 台湾, 日本, 韩国, 新加坡, 美国, 英国, 欧洲, 其他地区, 手动选择, 直接连接]}
SelectSG:     &SelectSG     {type: select, proxies: [新加坡, 全局代理, 故障转移, 香港, 台湾, 日本, 韩国, 美国, 英国, 欧洲, 其他地区, 手动选择, 直接连接]}
SelectUS:     &SelectUS     {type: select, proxies: [美国, 全局代理, 故障转移, 香港, 台湾, 日本, 韩国, 新加坡, 英国, 欧洲, 其他地区, 手动选择, 直接连接]}


# ############################################################################
# ##                                                                        ##
# ##   >>>>>>  在这里填写你的机场订阅链接 (本模板唯一必填项)  <<<<<<          ##
# ##                                                                        ##
# ##   把下面 url 的 https://example.com/airport 换成你自己的订阅地址即可。   ##
# ##   多个机场就复制一份, 机场名(机场1/机场2)不能重复。                      ##
# ##   不填 或 填错 会导致所有策略组为空, 面板里看不到任何节点。              ##
# ##                                                                        ##
# ############################################################################
proxy-providers:
  机场1:                                        # <-- 机场名, 随便改, 不能和其他机场重名
    <<: *BaseProvider
    url: 'https://example.com/airport'          # <-- ★★★ 必填: 换成你的机场订阅链接 ★★★
    # path: ./proxy_providers/airport1.yaml     # 自定义保存路径, 非必填
    # override: {additional-prefix: '[A] '}     # 给该机场所有节点加前缀, 非必填

  # 有第二个机场就取消下面三行的注释
  # 机场2:
  #   <<: *BaseProvider
  #   url: 'https://example.com/airport2'       # <-- 换成第二个机场的订阅链接


# ==================== 基础配置 ====================
mode: rule                        # 规则模式
mixed-port: 7890                  # socks/http 混合代理端口
redir-port: 7892                  # redirect 透明代理端口 (模块读取)
tproxy-port: 7893                 # tproxy 透明代理端口 (模块读取)
allow-lan: true                   # 允许局域网访问
bind-address: '*'
ipv6: true                        # 开启 ipv6
unified-delay: true               # 统一延迟 (扣除握手耗时, 更接近真实延迟)
tcp-concurrent: true              # TCP 并发连接, 多 IP 域名取最快
log-level: info                   # silent / error / warning / info / debug
find-process-mode: strict         # 进程匹配模式, 分应用代理依赖它
# global-client-fingerprint 已在 mihomo 1.19 移除, TLS 指纹请在节点上写 client-fingerprint,
# 或用 proxy-providers 的 override.override-expr 批量覆写

# TCP Keep Alive, 拉长间隔可减少 Android 后台耗电
keep-alive-interval: 30
keep-alive-idle: 600

# external-controller 的访问密钥, 留空为不校验 (WebUI 会读取此项)
# secret: ''

# ==================== Geo 数据 ====================
geodata-mode: true                # true=用 GeoIP.dat (模块已内置) / false=用 Country.mmdb
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geosite: https://ghfast.top/https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
  geoip: https://ghfast.top/https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
  mmdb: https://ghfast.top/https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-Country.mmdb
  asn: https://ghfast.top/https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb

# ==================== 管理面板 ====================
external-controller: 127.0.0.1:9090   # 模块读取此端口, 保持 ip:port 格式
external-ui: zashboard                # 模块已内置 zashboard, 访问 http://127.0.0.1:9090/ui
external-ui-name: zashboard
external-ui-url: 'https://ghfast.top/https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip'

# ==================== 域名嗅探 ====================
# https://wiki.metacubex.one/config/sniff
sniffer:
  enable: true
  parse-pure-ip: true             # 对无域名的纯 IP 连接也尝试嗅探
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - 'Mijia Cloud'
    - '+.push.apple.com'
    - '+.apple.com'

# ==================== 缓存与时间同步 ====================
profile:
  store-selected: true            # 记住面板里选过的策略
  store-fake-ip: true             # 缓存 fakeip 映射表

ntp:
  enable: true
  write-to-system: false          # 写入系统时间需要 root, 默认关闭
  server: time.apple.com
  port: 123
  interval: 30

# ==================== TUN ====================
# 模块开启 auto_tun 后会在启动时自动补写 exclude-package / include-package
tun:
  enable: true
  device: mihoyo
  stack: mixed
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  endpoint-independent-nat: true
  dns-hijack:
    - any:53
    - tcp://any:53

# ==================== hosts ====================
# 给 DoH 服务器预置 IP, 避免启动时的 DNS 循环依赖
hosts:
  doh.pub: [1.12.12.21, 120.53.53.53, 1.12.12.12]
  dot.pub: [1.12.12.21, 120.53.53.53, 1.12.12.12]
  '*.alidns.com': [223.5.5.5, 223.6.6.6, '2400:3200::1', '2400:3200:baba::1']
  dns.google: [8.8.8.8, 8.8.4.4, '2001:4860:4860::8888', '2001:4860:4860::8844']
  cloudflare-dns.com: [1.1.1.1, 1.0.0.1, '2606:4700:4700::1111', '2606:4700:4700::1001']

# ==================== DNS ====================
dns:
  enable: true
  listen: 0.0.0.0:1053            # 模块读取此端口, 保持 ip:port 格式
  ipv6: true
  cache-algorithm: arc
  respect-rules: true             # DNS 请求也遵循下面的分流规则
  # redir-host 兼容性最好; 想用 fake-ip 直接改这一项即可, 模块脚本已同时支持
  enhanced-mode: redir-host
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.market.xiaomi.com'
    - '+.push.apple.com'
    - '+.pub.3gppnetwork.org'
  default-nameserver:             # 仅用于解析下面 DoH 的域名, 必须是纯 IP
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:        # 解析机场节点域名, 必须直连
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver:              # 命中直连规则的域名用国内 DNS
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:                     # 默认 DNS
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  nameserver-policy:
    'geosite:cn,private,category-httpdns-cn':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    'geosite:gfw,geolocation-!cn':
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query


# ==================== 自建节点 ====================
# 没有自建节点就留空, 订阅节点在上面的 proxy-providers 里配置
proxies:


# ==================== 策略组 ====================
proxy-groups:

  # ---------- 主策略 ----------
  - {name: 全局代理, type: select, proxies: [故障转移, 香港, 台湾, 日本, 韩国, 新加坡, 美国, 英国, 欧洲, 其他地区, 手动选择, 直接连接], icon: 'https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png'}
  - {name: 兜底流量, <<: *SelectProxy, icon: 'https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png'}
  - {name: 国内直连, <<: *SelectDirect, icon: 'https://gcore.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/China.png'}
