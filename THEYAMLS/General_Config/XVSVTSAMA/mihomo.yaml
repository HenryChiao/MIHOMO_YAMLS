  # - https://dns.twnic.tw/dns-query            # Quad101 公共 DNS  # 101.101.101.10      101.102.103.10
  nameserver-policy:
    'rule-set:douyin':
    - system
    - 180.184.1.1
    - 180.184.2.2
    'rule-set:private':
    - system
    'rule-set:proxy@direct,cn,echs_direct':
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  prefer-h3: false
  respect-rules: false                                            
  enhanced-mode: fake-ip                  
  fake-ip-range: '198.18.0.1/16'
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist                    
  fake-ip-filter: 
    - rule-set:fakeip-filter_domain
    - rule-set:private
    - rule-set:cn
    - rule-set:echs_direct
    - rule-set:googlefcm
    - yacd.haishan.me
    - +.alipayeshop.com
    - rule-set:pixiv
    - pixshaft.com
    - gh-proxy.com

