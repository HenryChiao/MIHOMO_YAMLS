# ============================================================
# 服务型分流规则
# ============================================================
# 说明：
# 1. 服务规则必须位于通用 PROXY-Gate 规则之前；命中服务规则后，
#    流量直接进入对应服务策略组，不再继续匹配后面的规则。
# 2. 每个服务组均可独立选择 US/SG/HK/JP/TW/EUR/PROXY-Gate/DIRECT。
# 3. 本区域优先使用 DOMAIN-SUFFIX；只有服务域名体系非常分散时才使用
#    DOMAIN-KEYWORD。这样可以尽量避免不同服务之间发生误匹配。
# 4. 动态 CDN / 第三方云服务如果无法可靠确认归属，不使用过宽的
#    DOMAIN-SUFFIX,amazonaws.com / cloudfront.net / googleapis.com 等，
#    避免把其他服务一起劫持到某个服务组。
# 5. IP-CIDR 仅用于具有较稳定、公开且明确归属的服务网段；当前主要用于
#    Telegram。其他大型平台大量使用动态 CDN，因此不人为写死 IP。

# -------------------- YouTube --------------------
# 主站、短链接、播放器、图片、视频 CDN，以及 YouTube API。
- DOMAIN-SUFFIX,youtube.com,YouTube
- DOMAIN-SUFFIX,youtu.be,YouTube
- DOMAIN-SUFFIX,youtube-nocookie.com,YouTube
- DOMAIN-SUFFIX,youtubei.googleapis.com,YouTube
- DOMAIN-SUFFIX,youtube.googleapis.com,YouTube
- DOMAIN-SUFFIX,ytimg.com,YouTube
- DOMAIN-SUFFIX,googlevideo.com,YouTube
- DOMAIN-SUFFIX,ggpht.com,YouTube

# -------------------- Netflix --------------------
# 主站、API、图片、视频 CDN、搜索以及 Netflix 相关站点。
