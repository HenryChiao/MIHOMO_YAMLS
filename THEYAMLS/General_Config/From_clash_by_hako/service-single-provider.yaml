# ============================================================
# Clash 社区模板：单机场服务分类版
# 社区公开分享，按现状提供；DNS、WebRTC 与分流结果需在你的环境中复测。
# 文件会连接第三方 DNS，并下载远程规则集与图标；导入前请先阅读完整源码。
#
# DNS 测试异常时：
# 1. 先确保 Clash 处于启动代理状态。
# 2. 进入“更多 → DNS → DNS 查询”。
# 3. 依次点击“清空 DNS 缓存”和“清空 Fake-IP 缓存”。
# 4. 保持当前配置运行，再重新进行 DNS Leak Test。
# 从其他或旧配置切换后尤其建议先清理这两项缓存，避免旧结果干扰测试。
# 注意：Clash 必须在启动代理状态下，才能使用 DNS 缓存清理功能。
# 基本使用教程
# ============================================================
# 1. 添加机场订阅：
#    找到 proxy-providers → Primary-VPS → url，
#    将占位内容替换成你的机场订阅链接，例如：
#      url: https://example.com/xxxx
#    注意：url: 后面不能写成 `#https://...`，因为 # 会被 YAML 当作注释。
#
# 2. 启动后选择总策略：
#    PROXY-Gate 是主要的总出口策略组。
#    可以选择 Global-Manual、EUR-Manual、各地区 Auto、DIRECT 等作为整体代理出口。
#
# 3. 服务型策略组：
#    YouTube、Netflix、Disney+、Spotify、TikTok、Twitch、
#    GPT、Gemini、Claude、Copilot、Grok、Google、X、
#    Facebook、Instagram、WhatsApp、Telegram、Github、Speedtest
#    均可单独选择线路。
#
# 4. 服务组与 PROXY-Gate 相互独立：
#    例如可以设置 GPT → 🇺🇸 US-Auto，
#    Netflix → 🇸🇬 SG-Auto。
#    此时改变 PROXY-Gate 的选择，不会改变 GPT/Netflix 的选择。
#
# 5. Auto 组的含义：
#    选择某个地区 Auto 后，地区本身固定，
#    但 Auto 组仍会根据测速结果自动选择该地区的节点。
#    例如选择 🇺🇸 US-Auto，不代表固定某一台美国节点
#    而是会选择🇺🇸 US-Auto里的最快节点。
# 6. 手动固定单个节点：
#    如果需要固定到某一个具体节点，请进入对应的 Manual 组，
#    手动选择节点，再让相应的上级策略组使用该 Manual 组。
#
# 7. DIRECT：
#    选择 DIRECT 会让该服务组的流量直连。
#
# 8. 配置修改：
#    本配置中的订阅 URL、策略组选择等属于用户需要自行填写/调整的部分。
#    不要公开包含个人订阅 Token 的配置文件。
#
# ============================================================
# 以下为正式配置
# ============================================================

proxy-providers:
  Primary-VPS:
    type: http
    url: "" # 在英文双引号内粘贴你的机场订阅链接
    interval: 600

mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
ipv6: true

tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
dns:
  enable: true
  respect-rules: true
  ipv6: true
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 2400:3200::1
  nameserver:
  - https://dns.cloudflare.com/dns-query
  - https://dns.google/dns-query
  proxy-server-nameserver-policy:
#可选设置；此处可指定DNS解析你的节点


  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    dns.cloudflare.com:
    - 1.1.1.1
    - 1.0.0.1
    dns.google:
    - 8.8.8.8
    - 8.8.4.4
    dns.quad9.net:
    - 9.9.9.9
    - 149.112.112.112
    dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
    doh.pub:
    - 1.12.12.12
    - 120.53.53.53
    geosite:cn:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  fallback:
  - https://anycast.uncensoreddns.org/dns-query


  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 127.0.0.0/8
    - 0.0.0.0/32
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost
  - '*.msftconnecttest.com'
  - '*.msftncsi.com'
  - '*.msidentity.com'
  - captive.apple.com
  - '*.push.apple.com'
  - stun.*
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - +.weixin.com
  - +.wechat.com
  - +.qq.com
  - +.tencent.com
  - speedtest.net
profile:
  store-selected: true
  store-fake-ip: true

