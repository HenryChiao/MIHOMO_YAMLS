# ============================================================
# Clash 社区模板：双机场地区分类版
# 社区公开分享，按现状提供；DNS、WebRTC 与分流结果需在你的环境中复测。
# 文件会连接第三方 DNS，并下载远程规则集与图标；导入前请先阅读完整源码。
#
# DNS 测试异常时：
# 1. 先确保 Clash 处于启动代理状态。
# 2. 进入“更多 → DNS → DNS 查询”。
# 3. 依次点击“清空 DNS 缓存”和“清空 Fake-IP 缓存”。
# 4. 保持当前配置运行，再重新进行 DNS Leak Test。
# 从其他或旧配置切换后尤其建议先清理这两项缓存，避免旧结果干扰测试。
# 注意：Clash 必须在启动代理状态下，才能使用 DNS 缓存清理功能。
# Mihomo / Clash 通用型配置（双订阅版本）
# 适用目标：
# Windows / macOS / Android / iOS
#
# 核心模式：
# 支持两个订阅同时导入
# 中国大陆流量 → DIRECT
# 明确指定的海外服务 → PROXY-Gate
# 广告/隐私规则 → REJECT
# 未匹配流量 → PROXY-Gate（代理兜底）
#
# 注意：
# 1. 将 Primary-VPS.url 与 Backup-VPS.url 分别替换为两个订阅地址
# 2. 不要公开包含订阅 Token 的配置文件
# 3. 本配置默认不开放局域网代理
# 4. external-controller 仅允许本机访问
# ============================================================

proxy-providers:

#主力订阅#
  Primary-VPS:
    type: http

    # 将下面的地址替换为你的机场订阅地址
    url: "" # 在英文双引号内粘贴主力机场订阅链接

    interval: 600

#备用订阅#
  Backup-VPS:
    type: http

    # 将下面的地址替换为你的机场订阅地址
    url: "" # 在英文双引号内粘贴备用机场订阅链接

    interval: 600

# General


mixed-port: 7890

# 默认关闭局域网代理共享
# 如果需要让其他设备通过本机代理，再改为 true
allow-lan: false
# 保留通用监听方式，不强制绑定 127.0.0.1
bind-address: '*'

mode: rule
log-level: info
# Mihomo 控制 API
# 仅允许本机访问
external-controller: '127.0.0.1:9090'
# 统一延迟计算
unified-delay: true
# TCP 并发连接
tcp-concurrent: true
# IPv6
ipv6: true

# TUN

tun:
  enable: true
  # 跨平台通用 TUN 栈
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53

# DNS

dns:
  enable: true
  # DNS 请求遵守代理规则
  respect-rules: true
  ipv6: true
  # 与 respect-rules: true 搭配时关闭
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16



  # 用于基础 DNS 解析
  default-nameserver:

    - 223.5.5.5
    - 119.29.29.29
    - 2400:3200::1

  # Main Nameserver
  # 常规域名 DNS
  nameserver:
    # 🇺🇸 Cloudflare
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query

  # Proxy Server Nameserver Policy
  # 用于解析代理节点域名。
  # 如果你的节点是：
  # node.example.com
  # 可以在下方针对特定节点指定解析 DNS。
  proxy-server-nameserver-policy:

    # 示例：
    # 'node.example.com':
    #   - 223.5.5.5

    # 可以在此处指定代理节点域名的 DNS 解析策略



  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query


  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query


  nameserver-policy:

    # Cloudflare DoH 域名本身
    'dns.cloudflare.com':
      - 1.1.1.1
      - 1.0.0.1
    # Google DoH 域名本身
    'dns.google':
      - 8.8.8.8
      - 8.8.4.4
    # Quad9 DoH 域名本身
    'dns.quad9.net':
      - 9.9.9.9
      - 149.112.112.112
    # AliDNS DoH 域名本身
    'dns.alidns.com':
      - 223.5.5.5
      - 223.6.6.6
    # DNSPod DoH 域名本身
    'doh.pub':
      - 1.12.12.12
      - 120.53.53.53
    # 中国大陆域名
    'geosite:cn':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query


  fallback:

    # 🇩🇰 UncensoredDNS Anycast
    - https://anycast.uncensoreddns.org/dns-query


  fallback-filter:

    geoip: true

    geoip-code: CN

    ipcidr:
      - 240.0.0.0/4
      - 127.0.0.0/8
      - 0.0.0.0/32

  # 以下域名不使用 Fake-IP。
  fake-ip-filter:

    # LAN / Local
    - '*.lan'
    - '*.local'
    - 'localhost'
    # Windows Connectivity Check
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - '*.msidentity.com'
    # Apple
    - 'captive.apple.com'
    - '*.push.apple.com'
    # STUN / WebRTC / VoIP
    - 'stun.*'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'
    # WeChat / QQ / Tencent
    - '+.weixin.com'
    - '+.wechat.com'
    - '+.qq.com'
    - '+.tencent.com'
    # Speedtest
    - 'speedtest.net'

profile:

  # 保存策略组选择
  store-selected: true
  # 保存 Fake-IP 映射
  store-fake-ip: true
#-------------------#
#-------------------#
proxy-groups:
  - name: PROXY-Gate
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
    proxies:
      - 🔘 Primary-Manual
      - 🔘 Backup-Manual
      - 🌍 Other-Manual
      - 🇺🇸 US-Fallback
      - 🇸🇬 SG-Fallback
      - 🇭🇰 HK-Fallback
      - 🇯🇵 JP-Fallback
      - 🇹🇼 TW-Fallback
      - DIRECT

  - name: Apple Push
    type: fallback
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Apple.png
    proxies:
      - APNs-Fallback
      - DIRECT
    url: http://captive.apple.com/hotspot-detect.html
    interval: 300

  - name: 🔘 Primary-Manual
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Server.png
    use:
      - Primary-VPS

  - name: 🔘 Backup-Manual
