###Ayanami0's config###
mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
ipv6: false
mode: Rule
allow-lan: true
bind-address: "*"
disable-keep-alive: true
unified-delay: true
tcp-concurrent: true
log-level: silent
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 127.0.0.1:9090
secret: "123456"
external-ui: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/download/v3.13.1/dist-no-fonts.zip
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true
# —————————

p: &p
  type: http
  interval: 7200
  proxy: UPDATA
  header:
    User-Agent: [ClashMetaForAndroid]
  health-check:
    enable: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300

proxy-providers:
  α:
    <<: *p
    override:
      additional-prefix: "α-"
    path: ./proxies/α.yaml
    url: ##订阅链接##

  β:
    <<: *p
    override:
      additional-prefix: "β-"
    path: ./proxies/β.yaml
    url: ##订阅链接##

  γ:
    <<: *p
    override:
      additional-prefix: "γ-"
    path: ./proxies/γ.yaml
    url: ##订阅链接##

  δ:
    <<: *p
    override:
      additional-prefix: "δ-"
    path: ./proxies/δ.yaml
    url: ##订阅链接##

  ε:
    <<: *p
    override:
      additional-prefix: "ε-"
    path: ./proxies/ε.yaml
    url: ##订阅链接##

  ζ:
    <<: *p
    override:
      additional-prefix: "ζ-"
    path: ./proxies/ζ.yaml
    url: ##订阅链接##

  η:
    <<: *p
    override:
      additional-prefix: "η-"
    path: ./proxies/η.yaml
    url: ##订阅链接##

  θ:
    <<: *p
    override:
      additional-prefix: "θ-"
    path: ./proxies/θ.yaml
    url: ##订阅链接##
# —————————

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain: ["+.v2ex.com"]
  skip-domain:  ["Mijia Cloud", "+.push.apple.com"]
# —————————

tun:
  enable: false
  device: Meta
  stack: mips
  mtu: 1480
  dns-hijack: [any:53, tcp://any:53]
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true
# —————————

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  prefer-h3: false
  respect-rules: true
  cache-algorithm: arc
  cache-size: 4096
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "pool.ntp.org"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "RULE-SET:Lan"
    - "RULE-SET:GoogleFCM"
  default-nameserver: [223.5.5.5, 119.29.29.29, 223.6.6.6]
  direct-nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  proxy-server-nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  nameserver: [https://cloudflare-dns.com/dns-query, https://dns.google/dns-query]
  nameserver-policy:
    "RULE-SET:ChinaMax,Microsoft,Apple": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
# —————————

lite: &lite {type: select, include-all: true, lazy: true}
pg: &pg {type: select, proxies: [HK,SG,JP,TW,US,WD]}
md: &md {type: select, proxies: [Media,LowRate,HK,SG,JP,TW,US,WD]}
zl: &zl {type: select, proxies: [DIRECT,HK,SG,JP,TW,US,WD]}

proxy-groups:
  - {name: PROXY, type: select,
    icon: https://raw.githubusercontent.com/GitMetaio/Surfing/refs/heads/rm/Home/icon/All.svg,
    url: https://cp.cloudflare.com/generate_204, interval: 300,
    proxies: [HK,SG,JP,TW,US,WD,DIRECT], include-all: true}
  - {name: HK, <<: *lite,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png,
    filter: '^(?=.*(?:港|HK|hk|Hong ?Kong)).+'}
  - {name: SG, <<: *lite,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png,
    filter: '^(?=.*(?:新加坡|坡|狮城|SG|Singapore)).+'}
  - {name: JP, <<: *lite,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png,
    filter: '^(?=.*(?:日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)).+'}
  - {name: TW, <<: *lite,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png,
    filter: '^(?=.*(?:台|新北|彰化|TW|Taiwan)).+'}
  - {name: US, <<: *lite,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png,
    filter: '^(?=.*(?:美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|USA|United ?States)).+'}
  - {name: WD, <<: *lite,
    icon: https://raw.githubusercontent.com/GitMetaio/Surfing/refs/heads/rm/Home/icon/Globe.svg,
    filter: '^(?i)(?!.*(?:港|hk|hong ?kong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|jp|japan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|us|united ?states|台|新北|彰化|tw|taiwan|新加坡|坡|狮城|sg|singapore|traffic|expire|灾|网易|netease|套餐|重置|剩余|到期|订阅|群|账户|流量|有效期|时间|官网|防走失|建议)).+'}
  - {name: Steam, <<: *zl,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Steam.png,}
  - {name: Google, <<: *pg,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google.png}
  - {name: Telegram, <<: *pg,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png}
  - {name: LowRate, <<: *lite,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Download.png,
    filter: '(?<![0-9])0\.(?:0[0-9]{1,2}|[1-9])(?![0-9])'}
  - {name: Media, <<: *lite,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Media.png}
  - {name: Emby, <<: *md,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png}
  - {name: YouTube, <<: *md,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png}
  - {name: TikTok, <<: *md,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok.png}
  - {name: Apple, <<: *zl,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png}
  - {name: AI, <<: *pg,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AI.png}
  - {name: PayPal, <<: *pg,
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/PayPal.png}
  - {name: EH, <<: *pg,
    icon: https://raw.githubusercontent.com/lige47/lige_icon/blob/main/icon/04ProxySoft/exhentai.png}
  - {name: UPDATA, <<: *zl,
    icon: https://raw.githubusercontent.com/GitMetaio/Surfing/refs/heads/rm/Home/icon/Update.svg,}
  - {name: ADS, type: select,
    icon: https://raw.githubusercontent.com/GitMetaio/Surfing/refs/heads/rm/Home/icon/No-ads-all.svg,
    proxies: [REJECT-DROP,REJECT,PROXY]}
